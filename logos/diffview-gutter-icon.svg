<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Diffview Gutter</title>
  <desc id="desc">One plate split into remove and add, with plus and minus punched through</desc>
  <defs>
    <style>
      .plate { fill: #18181c; }
      .remove { fill: #a6a7b1; }
      .add { fill: #eceef2; }
      .punch { fill: #18181c; }
    </style>
    <clipPath id="gutter-clip">
      <rect x="14" y="14" width="100" height="100" rx="22"/>
    </clipPath>
  </defs>
  <rect class="plate" x="0" y="0" width="128" height="128"/>
  <g id="logo-symbol" clip-path="url(#gutter-clip)">
    <rect class="remove" x="14" y="14" width="50" height="100"/>
    <rect class="add" x="64" y="14" width="50" height="100"/>
  </g>
  <g id="logo-marks">
    <rect class="punch" x="25" y="58" width="28" height="12" rx="4"/>
    <rect class="punch" x="75" y="58" width="28" height="12" rx="4"/>
    <rect class="punch" x="83" y="50" width="12" height="28" rx="4"/>
  </g>
</svg>
